# Render Blueprint for the free hosted demo of the API. See docs/deployment-free.md for the whole procedure.
# The web app is hosted separately (Vercel) and the database is a free Neon project; secrets are entered in the dashboard,
# never written here. Values marked sync: false are asked for when the Blueprint is created.
services:
  - type: web
    name: queuecare-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # Database (Neon). DATABASE_URL = the restricted app role (runtime). MIGRATION_DATABASE_URL = the owner role (migrations only).
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: APP_DB_USER
        value: queuecare_app
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "2"
      # Random secrets generated by Render; they must be different from each other and at least 32 characters.
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      # Cookies and origins: the web app's address on Vercel, exactly as typed in the browser (https, no trailing slash).
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Two proxies sit in front of the API (Vercel, then Render's load balancer), so the visitor's address is the second from the right.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: EMAIL_PROVIDER
        value: mock
      # No REDIS_URL on purpose: with a single instance the in-memory broker, tickets and rate limits are correct.
